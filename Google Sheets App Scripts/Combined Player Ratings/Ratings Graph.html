<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Player Ratings Over Time</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --border: #e1e4e8;
      --text: #1b1f23;
      --muted: #6a737d;
      --accent: #0366d6;
      --peach: #fce5cd;
      --peach-light: #fde5e0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 16px;
      background: var(--peach-light);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 24px; font-weight: 800; margin: 0; }
    #body {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    #sidebar {
      width: 240px;
      min-width: 200px;
      background: var(--peach-light);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 10px;
    }
    #sidebar .toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    #sidebar .toolbar button {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--peach);
      cursor: pointer;
    }
    #sidebar .toolbar button#showAll { background: #c5eec5; }
    #sidebar .toolbar button#hideInactive { background: #d9d2e9; }
    #sidebar .toolbar button#hideAll { background: #ffa5a5; }
    #sidebar .toolbar button:hover { background: #f5d8b2; }
    #sidebar .toolbar button#showAll:hover { background: #aee4ae; }
    #sidebar .toolbar button#hideInactive:hover { background: #c4badb; }
    #sidebar .toolbar button#hideAll:hover { background: #f28d8d; }
    #count { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
    .player-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      background: #fce5cd;
      user-select: none;
    }
    .player-row:hover { background: #f5d8b2; }
    .player-row.off { background: #fde5e0; opacity: 0.38; }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.15);
    }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #chartWrap {
      flex: 1;
      padding: 14px;
      min-width: 0;
      background: var(--peach);
    }
    #chartBox { position: relative; height: 100%; width: 100%; }
    #chartBox canvas { position: absolute; inset: 0; }
    #error {
      display: none;
      margin: 20px;
      padding: 14px;
      background: #fff5f5;
      border: 1px solid #f1c0c0;
      border-radius: 8px;
      color: #b00020;
      font-size: 13px;
    }
    #loading {
      margin: 20px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Player Ratings Over Time</h1>
    </header>
    <div id="body">
      <div id="sidebar">
        <div class="toolbar">
          <button id="showAll">Select All</button>
          <button id="hideInactive">Hide Inactive</button>
          <button id="hideAll">Clear</button>
        </div>
        <p id="count"></p>
        <div id="names"></div>
      </div>
      <div id="chartWrap">
        <div id="chartBox"><canvas id="chart"></canvas></div>
      </div>
    </div>
  </div>
  <div id="loading">Loading data&hellip;</div>
  <div id="error"></div>

  <script>
    var LS_KEY = 'ttRatingsGraphHidden';
    var DEFAULT_RADIUS = 2;
    var HOVER_RADIUS = 5;

    var state = {
      roster: [],
      colors: [],
      lastDate: {},     // name -> dateMillis or null
      fade: {},          // name -> peach hex or null (weeks 9-16)
      series: {},
      hidden: {},        // name -> true when hidden
      chart: null,
      active: null       // { di, idx } momentarily highlighted node
    };

    function loadSavedHidden() {
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (raw) {
          var arr = JSON.parse(raw);
          if (Array.isArray(arr)) {
            arr.forEach(function (n) { state.hidden[n] = true; });
          }
        }
      } catch (e) { /* ignore corrupt storage */ }
    }

    function saveHidden() {
      var arr = Object.keys(state.hidden).filter(function (n) { return state.hidden[n]; });
      try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch (e) { /* ignore */ }
    }

    function fmtDate(ms) {
      var d = new Date(ms);
      var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return months[d.getMonth()] + ' ' + d.getDate() + ', ' + String(d.getFullYear()).slice(2);
    }

    function fmtRating(v) {
      return Number.isInteger(v) ? String(v) : v.toFixed(1);
    }

    function buildChart() {
      var datasets = [];
      for (var i = 0; i < state.roster.length; i++) {
        var name = state.roster[i];
        var pts = state.series[name] || [];
        var data = pts.map(function (pt) {
          return { x: new Date(pt[0]), y: pt[1] };
        });
        datasets.push({
          label: name,
          data: data,
          borderColor: state.colors[i],
          backgroundColor: state.colors[i],
          borderWidth: 1.5,
          pointRadius: function (ctx) {
            return state.active &&
                   ctx.datasetIndex === state.active.di &&
                   ctx.dataIndex === state.active.idx ? 7 : DEFAULT_RADIUS;
          },
          pointHoverRadius: HOVER_RADIUS,
          pointHoverBorderWidth: 2,
          tension: 0.05,
          spanGaps: false,
          hidden: !!state.hidden[name]
        });
      }

      var ctx = document.getElementById('chart').getContext('2d');
      state.chart = new Chart(ctx, {
        type: 'line',
        data: { datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'point',
            intersect: false
          },
          onClick: onCanvasClick,
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'point',
              intersect: false,
              callbacks: {
                title: function (items) {
                  if (!items.length) return '';
                  var it = items[0];
                  var ds = state.chart.data.datasets[it.datasetIndex];
                  return ds.label;
                },
                label: function (ctx) {
                  var pt = ctx.parsed;
                  return fmtDate(pt.x) + '  ·  ' + fmtRating(pt.y);
                }
              }
            }
          },
          scales: {
            x: {
              type: 'time',
              time: { unit: 'month', displayFormats: { month: 'MMM yy' } },
              title: { display: true, text: 'Date' }
            },
            y: {
              type: 'linear',
              title: { display: true, text: 'Rating' }
            }
          }
        }
      });
    }

    function onCanvasClick(evt) {
      var els = state.chart.getElementsAtEventForMode(evt, 'point', { intersect: false }, false);
      if (els && els.length) {
        var el = els[0];
        state.active = { di: el.datasetIndex, idx: el.index };
        state.chart.tooltip.setActiveElements([{ datasetIndex: el.datasetIndex, index: el.index }], evt);
        state.chart.update();
        setTimeout(function () {
          if (state.active) {
            state.active = null;
            state.chart.update();
          }
        }, 2000);
      }
    }

    function visibleCount() {
      var n = 0;
      for (var i = 0; i < state.roster.length; i++) {
        if (!state.hidden[state.roster[i]]) n++;
      }
      return n;
    }

    function cropAxis() {
      var minY = Infinity;
      var maxY = -Infinity;
      var any = false;
      for (var i = 0; i < state.chart.data.datasets.length; i++) {
        var ds = state.chart.data.datasets[i];
        if (ds.hidden) continue;
        for (var j = 0; j < ds.data.length; j++) {
          var v = ds.data[j].y;
          if (v !== null && isFinite(v)) {
            if (v < minY) minY = v;
            if (v > maxY) maxY = v;
            any = true;
          }
        }
      }
      var scale = state.chart.options.scales.y;
      if (any && isFinite(minY) && isFinite(maxY)) {
        var pad = Math.max(10, (maxY - minY) * 0.08);
        scale.min = Math.floor((minY - pad) / 10) * 10;
        scale.max = Math.ceil((maxY + pad) / 10) * 10;
      } else {
        scale.min = undefined;
        scale.max = undefined;
      }
    }

    function togglePlayer(name) {
      state.hidden[name] = !state.hidden[name];
      saveHidden();
      for (var i = 0; i < state.chart.data.datasets.length; i++) {
        var ds = state.chart.data.datasets[i];
        if (ds.label === name) ds.hidden = !!state.hidden[name];
      }
      cropAxis();
      state.chart.update();
      renderNames();
    }

    function setAll(shown) {
      state.hidden = {};
      if (!shown) {
        for (var i = 0; i < state.roster.length; i++) state.hidden[state.roster[i]] = true;
      }
      saveHidden();
      for (var j = 0; j < state.chart.data.datasets.length; j++) {
        state.chart.data.datasets[j].hidden = !!state.hidden[state.chart.data.datasets[j].label];
      }
      cropAxis();
      state.chart.update();
      renderNames();
    }

    function isInactive(name) {
      // A player counts as inactive when the server gave them a fade color
      // (font not #000000 black). Driven by the server's week 9-16 ramp so the
      // button automatically tracks whatever date logic the server adopts.
      return !!state.fade[name];
    }

    function hideInactive() {
      // Hide every player the server has faded (font not black); show the rest.
      state.hidden = {};
      for (var i = 0; i < state.roster.length; i++) {
        if (isInactive(state.roster[i])) state.hidden[state.roster[i]] = true;
      }
      saveHidden();
      for (var j = 0; j < state.chart.data.datasets.length; j++) {
        state.chart.data.datasets[j].hidden = !!state.hidden[state.chart.data.datasets[j].label];
      }
      cropAxis();
      state.chart.update();
      renderNames();
    }

    function renderNames() {
      var container = document.getElementById('names');
      container.innerHTML = '';
      for (var i = 0; i < state.roster.length; i++) {
        (function (idx) {
          var name = state.roster[idx];
          var row = document.createElement('div');
          row.className = 'player-row' + (state.hidden[name] ? ' off' : '');
          row.title = name;
          var sw = document.createElement('span');
          sw.className = 'swatch';
          sw.style.background = state.colors[idx];
          var nm = document.createElement('span');
          nm.className = 'name';
          nm.textContent = name;
          nm.style.color = state.fade[name] || '#1b1f23';
          row.appendChild(sw);
          row.appendChild(nm);
          row.addEventListener('click', function () { togglePlayer(name); });
          container.appendChild(row);
        })(i);
      }
      document.getElementById('count').textContent =
        visibleCount() + ' of ' + state.roster.length + ' shown';
    }

    function init(data) {
      document.getElementById('loading').style.display = 'none';
      if (!data || !data.roster || !data.roster.length) {
        showError('No roster data found.');
        return;
      }
      state.roster = data.roster;
      state.colors = data.colors;
      state.lastDate = data.lastDate || {};
      state.fade = data.fade || {};
      state.series = data.series || {};
      loadSavedHidden();
      buildChart();
      cropAxis();
      state.chart.update();
      renderNames();
      document.getElementById('showAll').addEventListener('click', function () { setAll(true); });
      document.getElementById('hideInactive').addEventListener('click', function () { hideInactive(); });
      document.getElementById('hideAll').addEventListener('click', function () { setAll(false); });
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      var el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function getSsid() {
      var m = window.location.search.match(/[?&]ss=([^&]+)/);
      return m ? m[1] : 'combined';
    }

    google.script.run
      .withSuccessHandler(init)
      .withFailureHandler(function (err) {
        showError('Could not load graph data. ' + (err && err.message ? err.message : err));
      })
      .getGraphData(getSsid());
  </script>
</body>
</html>
