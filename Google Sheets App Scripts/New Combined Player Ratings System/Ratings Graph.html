<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Player Ratings Over Time</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --border: #e1e4e8;
      --text: #1b1f23;
      --muted: #6a737d;
      --accent: #0366d6;
      --peach: #fce5cd;
      --peach-light: #fdf1e5;
      --border-strong: #c9ad8a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #sidebar .logo {
      display: block;
      width: 100%;
      max-height: 110px;
      object-fit: contain;
      margin: 0 0 10px;
      border-radius: 6px;
    }
    #body {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    #sidebar {
      width: 240px;
      min-width: 200px;
      background: var(--peach-light);
      border-right: 2px solid var(--border-strong);
      overflow-y: auto;
      padding: 10px;
    }
    #sidebar .toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    #sidebar .toolbar button {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 700;
      border: 2px solid var(--border-strong);
      border-radius: 6px;
      background: var(--peach);
      cursor: pointer;
    }
    #sidebar .toolbar button#showAll { background: #c5eec5; }
    #sidebar .toolbar button#hideInactive { background: #d9d2e9; }
    #sidebar .toolbar button#hideAll { background: #ffa5a5; }
    #sidebar .toolbar button:hover { background: #f5d8b2; }
    #sidebar .toolbar button#showAll:hover { background: #aee4ae; }
    #sidebar .toolbar button#hideInactive:hover { background: #c4badb; }
    #sidebar .toolbar button#hideAll:hover { background: #f28d8d; }
    #count { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
    .player-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      background: #fce5cd;
      user-select: none;
    }
    .player-row:hover { background: #f5d8b2; }
    .player-row.off { background: #fdf1e5; opacity: 0.38; }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.15);
    }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #chartWrap {
      flex: 1;
      padding: 14px;
      min-width: 0;
      background: var(--peach);
      border-bottom: 2px solid var(--border-strong);
    }
    #chartBox { position: relative; height: 100%; width: 100%; }
    #chartBox canvas { position: absolute; inset: 0; }
    #error {
      display: none;
      margin: 20px;
      padding: 14px;
      background: #fff5f5;
      border: 1px solid #f1c0c0;
      border-radius: 8px;
      color: #b00020;
      font-size: 13px;
    }
    #loading {
      margin: 20px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>

        <div class="toolbar">
          <button id="showAll">Select All</button>
          <button id="hideInactive">Hide Inactive</button>
          <button id="hideAll">Clear</button>

        <p id="count"></p>

  <div id="loading">Loading data&hellip;</div>
  <div id="error"></div>

  <script>
    var LS_KEY = 'ttRatingsGraphHidden';
    var DEFAULT_RADIUS = 2;
    var HOVER_RADIUS = 5;
    var CLICK_TOL = 30; // max px from a line for a click to count as selecting it

    var state = {
      roster: [],
      colors: [],
      lastDate: {},     // name -> dateMillis or null
      fade: {},          // name -> peach hex or null (weeks 9-16)
      series: {},
      hidden: {},        // name -> true when hidden
      chart: null,
      active: null       // { di, idx } momentarily highlighted node
    };

    function loadSavedHidden() {
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (raw) {
          var arr = JSON.parse(raw);
          if (Array.isArray(arr)) {
            arr.forEach(function (n) { state.hidden[n] = true; });
            return true; // a stored choice exists (even Show All) - honor it
          }
        }
      } catch (e) { /* ignore corrupt storage */ }
      return false;
    }

    function saveHidden() {
      var arr = Object.keys(state.hidden).filter(function (n) { return state.hidden[n]; });
      try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch (e) { /* ignore */ }
    }

    function fmtDate(ms) {
      var d = new Date(ms);
      var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return months[d.getMonth()] + ' ' + d.getDate() + ', ' + String(d.getFullYear()).slice(2);
    }

    function fmtRating(v) {
      return Number.isInteger(v) ? String(v) : v.toFixed(1);
    }

    var customXAxisPlugin = {
      id: 'customXAxis',
      beforeDatasetsDraw: function (chart) {
        var area = chart.chartArea;
        var xs = chart.scales.x;
        if (!area || !xs) return;
        var cfg = chart.options.plugins.customXAxis || {};
        var ctx = chart.ctx;
        var ticks = xs.ticks || [];
        ctx.save();
        ctx.strokeStyle = cfg.frameColor || 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 2;
        ctx.strokeRect(area.left, area.top, area.right - area.left, area.bottom - area.top);
        ctx.strokeStyle = cfg.yearColor || 'rgba(0,0,0,0.55)';
        ctx.lineWidth = 2;
        for (var i = 1; i < ticks.length; i++) {
          var d = new Date(ticks[i].value);
          if (d.getMonth() !== 0) continue;
          var px = xs.getPixelForValue(ticks[i].value);
          if (px < area.left || px > area.right) continue;
          ctx.beginPath();
          ctx.moveTo(px, area.top);
          ctx.lineTo(px, area.bottom);
          ctx.stroke();
        }
        ctx.restore();
      },
      afterDatasetsDraw: function (chart) {
        var area = chart.chartArea;
        var xs = chart.scales.x;
        if (!area || !xs) return;
        var cfg = chart.options.plugins.customXAxis || {};
        var ctx = chart.ctx;
        var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        var ticks = xs.ticks || [];
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#6a737d';
        for (var i = 0; i < ticks.length; i++) {
          var px0 = xs.getPixelForValue(ticks[i].value);
          var px1 = i + 1 < ticks.length
            ? xs.getPixelForValue(ticks[i + 1].value)
            : px0 + (px0 - xs.getPixelForValue(ticks[i - 1].value));
          var mid = (px0 + px1) / 2;
          if (mid < area.left || mid > area.right) continue;
          if (px1 - px0 < 45) continue;
          ctx.fillText(MON[new Date(ticks[i].value).getMonth()], mid, area.bottom + 9);
        }
        var years = [];
        for (var k = 0; k < ticks.length; k++) {
          var y = new Date(ticks[k].value).getFullYear();
          if (years.indexOf(y) === -1) years.push(y);
        }
        ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#24292f';
        for (var m = 0; m < years.length; m++) {
          var s0 = Math.max(xs.min, new Date(years[m], 0, 1).getTime());
          var s1 = Math.min(xs.max, new Date(years[m] + 1, 0, 1).getTime());
          var xm = (xs.getPixelForValue(s0) + xs.getPixelForValue(s1)) / 2;
          ctx.fillText(String(years[m]), xm, area.bottom + 24);
        }
        ctx.strokeStyle = cfg.lineColor || 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1;
        var seen = {};
        for (var di = 0; di < chart.data.datasets.length; di++) {
          var pts = chart.data.datasets[di].data;
          for (var j = 0; j < pts.length; j++) {
            var t = pts[j].x instanceof Date ? pts[j].x.getTime() : pts[j].x;
            if (seen[t]) continue;
            seen[t] = true;
            var xp = xs.getPixelForValue(t);
            if (xp < area.left || xp > area.right) continue;
            ctx.beginPath();
            ctx.moveTo(xp, area.bottom);
            ctx.lineTo(xp, area.bottom + 4);
            ctx.stroke();
          }
        }
        ctx.restore();
      }
    };

    function buildChart() {
      var datasets = [];
      for (var i = 0; i < state.roster.length; i++) {
        var name = state.roster[i];
        var pts = state.series[name] || [];
        var data = pts.map(function (pt) {
          return { x: new Date(pt[0]), y: pt[1] };
        });
        datasets.push({
          label: name,
          data: data,
          borderColor: state.colors[i],
          backgroundColor: state.colors[i],
          borderWidth: function (ctx) {
            return state.active && ctx.datasetIndex === state.active.di ? 4 : 1.5;
          },
          pointRadius: function (ctx) {
            return state.active &&
                   ctx.datasetIndex === state.active.di &&
                   ctx.dataIndex === state.active.idx ? 7 : DEFAULT_RADIUS;
          },
          pointHoverRadius: HOVER_RADIUS,
          pointHoverBorderWidth: 2,
          tension: 0.05,
          spanGaps: false,
          hidden: !!state.hidden[name]
        });
      }

      // Completely replace canvas to ensure clean slate
      var chartWrap = document.getElementById('chartWrap');
      var oldCanvas = document.getElementById('chart');
      var newCanvas = document.createElement('canvas');
      newCanvas.id = 'chart';
      oldCanvas.parentNode.replaceChild(newCanvas, oldCanvas);

      var ctx = newCanvas.getContext('2d');
      state.chart = new Chart(ctx, {
        type: 'line',
        data: { datasets: datasets },
        plugins: [customXAxisPlugin],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          events: [],
          plugins: {
            customXAxis: { lineColor: 'rgba(0,0,0,0.35)', yearColor: 'rgba(0,0,0,0.55)' },
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: function (items) {
                  if (!items.length) return '';
                  var it = items[0];
                  var ds = state.chart.data.datasets[it.datasetIndex];
                  return ds.label;
                },
                label: function (ctx) {
                  var pt = ctx.parsed;
                  return fmtDate(pt.x) + '  ·  ' + fmtRating(pt.y);
                }
              }
            }
          },
          scales: {
            x: {
              type: 'time',
              time: { unit: 'month' },
              grid: { color: 'rgba(0,0,0,0.08)' },
              border: { display: false },
              ticks: { display: false, autoSkip: false },
              title: { display: true, text: ' ', padding: 10 }
            },
            y: {
              type: 'linear',
              ticks: { font: { weight: 'bold' } },
              title: {
                display: true,
                text: 'Rating',
                font: { size: 14, weight: 'bold' },
                color: '#24292f'
              }
            }
          }
        }
      });
      newCanvas.addEventListener('click', onCanvasClick);
    }

    function distToSegmentSq(px, py, ax, ay, bx, by) {
      var dx = bx - ax;
      var dy = by - ay;
      var len2 = dx * dx + dy * dy;
      if (len2 === 0) return (px - ax) * (px - ax) + (py - ay) * (py - ay);
      var t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
      var cx = ax + t * dx;
      var cy = ay + t * dy;
      return (px - cx) * (px - cx) + (py - cy) * (py - cy);
    }

    function onCanvasClick(evt) {
      var rect = state.chart.canvas.getBoundingClientRect();
      var clickX = evt.clientX - rect.left;
      var clickY = evt.clientY - rect.top;

      var bestDi = -1;
      var bestIdx = -1;
      var bestLineDist = Infinity;

      for (var di = 0; di < state.chart.data.datasets.length; di++) {
        var ds = state.chart.data.datasets[di];
        if (ds.hidden) continue;

        var els = state.chart.getDatasetMeta(di).data;
        if (!els.length) continue;

        var lineDist = Infinity;
        var nodeDist = Infinity;
        var nodeIdx = -1;

        for (var j = 0; j < els.length; j++) {
          var el = els[j];
          if (el.skip) continue;
          var px = el.x;
          var py = el.y;

          var dNode = (clickX - px) * (clickX - px) + (clickY - py) * (clickY - py);
          if (dNode < nodeDist) {
            nodeDist = dNode;
            nodeIdx = j;
          }

          if (j > 0) {
            var prev = els[j - 1];
            if (prev.skip) continue;
            var dSeg = distToSegmentSq(clickX, clickY, prev.x, prev.y, px, py);
            if (dSeg < lineDist) lineDist = dSeg;
          } else {
            if (dNode < lineDist) lineDist = dNode;
          }
        }

        if (lineDist < bestLineDist) {
          bestLineDist = lineDist;
          bestDi = di;
          bestIdx = nodeIdx;
        }
      }

      if (bestDi === -1 || bestLineDist > CLICK_TOL * CLICK_TOL) {
        if (state.active) {
          state.active = null;
          state.chart.update();
        }
        return;
      }

      state.active = { di: bestDi, idx: bestIdx };
      state.chart.tooltip.setActiveElements([{ datasetIndex: bestDi, index: bestIdx }], { x: clickX, y: clickY });
      state.chart.update();
    }

    function visibleCount() {
      var n = 0;
      for (var i = 0; i < state.roster.length; i++) {
        if (!state.hidden[state.roster[i]]) n++;
      }
      return n;
    }

    function cropAxis() {
      var minY = Infinity;
      var maxY = -Infinity;
      var any = false;
      var hasVisibleData = false;
      for (var i = 0; i < state.chart.data.datasets.length; i++) {
        var ds = state.chart.data.datasets[i];
        if (ds.hidden) continue;
        if (!ds.data || ds.data.length === 0) continue;
        hasVisibleData = true;
        for (var j = 0; j < ds.data.length; j++) {
          var v = ds.data[j].y;
          if (v !== null && isFinite(v)) {
            if (v < minY) minY = v;
            if (v > maxY) maxY = v;
            any = true;
          }
        }
      }
      var scale = state.chart.options.scales.y;
      if (any && isFinite(minY) && isFinite(maxY)) {
        var pad = Math.max(10, (maxY - minY) * 0.08);
        scale.min = Math.floor((minY - pad) / 10) * 10;
        scale.max = Math.ceil((maxY + pad) / 10) * 10;
      } else if (hasVisibleData) {
        scale.min = 0;
        scale.max = 2000;
      } else {
        scale.min = undefined;
        scale.max = undefined;
      }
    }

    function togglePlayer(name) {
      state.active = null;
      state.hidden[name] = !state.hidden[name];
      saveHidden();
      for (var i = 0; i < state.chart.data.datasets.length; i++) {
        var ds = state.chart.data.datasets[i];
        if (ds.label === name) ds.hidden = !!state.hidden[name];
      }
      // If we're going from all-hidden to one-visible, force a full reset
      var wasAllHidden = !state.chart.data.datasets.some(function (ds) { return !ds.hidden; });
      var nowOneVisible = !state.hidden[name];
      if (wasAllHidden && nowOneVisible) {
        // Force a full chart reset to clear any internal Chart.js state issues
        state.chart.destroy();
        buildChart();
      } else {
        cropAxis();
      }
      try { state.chart.update(); } catch (e) { console.error('Chart update failed:', e); }
      renderNames();
    }

    function setAll(shown) {
      state.active = null;
      state.hidden = {};
      if (!shown) {
        for (var i = 0; i < state.roster.length; i++) state.hidden[state.roster[i]] = true;
      }
      saveHidden();
      for (var j = 0; j < state.chart.data.datasets.length; j++) {
        state.chart.data.datasets[j].hidden = !!state.hidden[state.chart.data.datasets[j].label];
      }
      cropAxis();
      try { state.chart.update(); } catch (e) { console.error('Chart update failed:', e); }
      renderNames();
    }

    function isInactive(name) {
      // A player counts as inactive when the server gave them a fade color
      // (font not #000000 black). Driven by the server's week 9-16 ramp so the
      // button automatically tracks whatever date logic the server adopts.
      return !!state.fade[name];
    }

    function hideInactive() {
      // Hide every player the server has faded (font not black); show the rest.
      state.active = null;
      state.hidden = {};
      for (var i = 0; i < state.roster.length; i++) {
        if (isInactive(state.roster[i])) state.hidden[state.roster[i]] = true;
      }
      saveHidden();
      for (var j = 0; j < state.chart.data.datasets.length; j++) {
        state.chart.data.datasets[j].hidden = !!state.hidden[state.chart.data.datasets[j].label];
      }
      cropAxis();
      try { state.chart.update(); } catch (e) { console.error('Chart update failed:', e); }
      renderNames();
    }

    function renderNames() {
      var container = document.getElementById('names');
      container.innerHTML = '';
      for (var i = 0; i < state.roster.length; i++) {
        (function (idx) {
          var name = state.roster[idx];
          var row = document.createElement('div');
          row.className = 'player-row' + (state.hidden[name] ? ' off' : '');
          row.title = name;
          var sw = document.createElement('span');
          sw.className = 'swatch';
          sw.style.background = state.colors[idx];
          var nm = document.createElement('span');
          nm.className = 'name';
          nm.textContent = name;
          nm.style.color = state.fade[name] || '#1b1f23';
          row.appendChild(sw);
          row.appendChild(nm);
          row.addEventListener('click', function () { togglePlayer(name); });
          container.appendChild(row);
        })(i);
      }
      document.getElementById('count').textContent =
        visibleCount() + ' of ' + state.roster.length + ' shown';
    }

    function init(data) {
      clearTimeout(watchdog);
      document.getElementById('loading').style.display = 'none';
      if (!data || !data.roster || !data.roster.length) {
        showError('No roster data found.');
        return;
      }
      state.roster = data.roster;
      state.colors = data.colors;
      state.lastDate = data.lastDate || {};
      state.fade = data.fade || {};
      state.series = data.series || {};
      // Default to the same view the Hide Inactive button produces: load with
      // only the active players' lines showing. If the visitor already has a
      // stored choice (e.g. Show All), that choice is honored instead. Done
      // before buildChart() so buildChart's dataset `hidden` flags pick it up.
      if (!loadSavedHidden()) {
        var hiddenInit = [];
        for (var hn = 0; hn < state.roster.length; hn++) {
          if (isInactive(state.roster[hn])) hiddenInit.push(state.roster[hn]);
        }
        if (hiddenInit.length) {
          state.active = null;
          for (var hk = 0; hk < hiddenInit.length; hk++) state.hidden[hiddenInit[hk]] = true;
          saveHidden();
        }
      }
      buildChart();
      cropAxis();
      try { state.chart.update(); } catch (e) { console.error('Chart update failed:', e); }
      renderNames();
      document.getElementById('showAll').addEventListener('click', function () { setAll(true); });
      document.getElementById('hideInactive').addEventListener('click', function () { hideInactive(); });
      document.getElementById('hideAll').addEventListener('click', function () { setAll(false); });
    }

    function showError(msg) {
      clearTimeout(watchdog);
      document.getElementById('loading').style.display = 'none';
      var el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function getSsid() {
      var m = window.location.search.match(/[?&]ss=([^&]+)/);
      return m ? m[1] : 'combined';
    }

    // If the server call has not answered (or failed) within 40 seconds,
    // replace the spinner with an actionable message instead of hanging on
    // "Loading data..." forever. init()/showError() cancel it on success.
    var watchdog = setTimeout(function () {
      showError('Loading took too long. Please refresh the page; if this keeps happening, tell the league that the graph server timed out.');
    }, 40000);

    google.script.run
      .withSuccessHandler(init)
      .withFailureHandler(function (err) {
        showError('Could not load graph data. ' + (err && err.message ? err.message : err));
      })
      .getGraphData(getSsid());
  </script>
</body>
</html>
